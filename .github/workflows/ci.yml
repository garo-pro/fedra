name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all --check
  test:
    name: Tests and clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Install CMake and Ninja
        run: choco install cmake ninja -y
      # wxdragon-sys builds wxWidgets with CMake into target/<profile>/*_cmake_build,
      # which rust-cache does not know about. Cache those too, otherwise a hit
      # restores the build-script fingerprint without the libraries it produced
      # and the link fails on a missing WebView2LoaderStatic.lib.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: |
            target/debug/wxwidgets_cmake_build
            target/debug/wxdragon_sys_cmake_build
      # Clippy runs first so the dependency tree is built once, in the same
      # profile the tests then reuse. Checking in release meant compiling
      # everything a second time under LTO for no extra findings.
      # The crate warns on clippy::all, pedantic and nursery, so -D warnings
      # makes every one of those fatal here.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
